name: Update README cards

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allows manual testing

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, repositories
          base_indepth: yes
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: Africa/Cairo
          config_order: base.header, base.activity, base.repositories

      - name: Generate Top Languages Card
        uses: lowlighter/metrics@latest
        with:
          filename: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: Africa/Cairo
          
          # Diagnostic logs to see all repositories and diff counts
          debug: yes

          # Map commit authoring across your GitHub username, name, and noreply email
          commits_authoring: 137009632+omar-elsherbiny@users.noreply.github.com, omar-elsherbiny, Omar Elsherbiny

          repositories_skipped: Image-Face-Aligner, Digital-Logic-Sim-Computer
          # plugin_languages_skipped: >-
          #   Image-Face-Aligner,
          #   Digital-Logic-Sim-Computer,

          # In-depth language configuration
          plugin_languages: yes
          # plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 300 # Global timeout ceiling in seconds
          plugin_languages_analysis_timeout_repositories: 45 # Per-repo diff timeout ceiling
          # plugin_languages_categories: markup, programming # Includes Markdown, HTML, XML, etc. alongside code[cite: 1]
          plugin_languages_details: bytes-compact, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 10 
          plugin_languages_other: yes
          plugin_languages_threshold: 0%
