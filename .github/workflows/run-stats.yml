name: Update README cards

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch: # Allows manual testing

jobs:
  metrics:
    runs-on: ubuntu-latest
    environment: METRICS_TOKEN
    permissions:
      contents: write

    steps:
      - name: Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, repositories
          base_indepth: yes
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: Africa/Cairo
          config_order: base.header, base.activity, base.repositories

      - name: Generate Top Languages Card
        uses: lowlighter/metrics@latest
        with:
          filename: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_details: bytes-compact, percentage
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_threshold: 0%
